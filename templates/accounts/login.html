{% extends "base.html" %}
{% block title %}Kirish — Dori Narxlari{% endblock %}
{% block content %}
<div class="mx-auto max-w-sm space-y-4">
  <h1 class="text-2xl font-bold text-gray-900 text-center">Kirish</h1>
  <form method="post" class="space-y-3 rounded-xl border border-gray-200 bg-white p-6 shadow-sm">
    {% csrf_token %}
    {% if form.non_field_errors %}
      <p class="rounded-lg bg-red-50 p-3 text-sm text-red-700">{{ form.non_field_errors.0 }}</p>
    {% endif %}
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Foydalanuvchi nomi</label>
      {{ form.username }}
    </div>
    <div>
      <label class="block text-sm font-medium text-gray-700 mb-1">Parol</label>
      {{ form.password }}
    </div>
    <button type="submit" class="w-full rounded-lg bg-brand-600 px-4 py-2.5 font-medium text-white hover:bg-brand-700">Kirish</button>
  </form>
  <p class="text-center text-sm text-gray-500">
    Hisobingiz yo'qmi? <a href="{% url 'accounts:register' %}" class="text-brand-700 font-medium">Ro'yxatdan o'ting</a>
  </p>
</div>
{% endblock %}
